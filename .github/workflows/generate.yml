name: generate

on:
  schedule:
    # ~06:00 in Italy (CEST/UTC+2 in summer, so this drifts to ~05:00 local in winter/CET)
    - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: agent-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Restore generated state (history + posts + images)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history.json
            data/seen_urls.json
            output/
          key: agent-state-${{ github.run_id }}
          restore-keys: |
            agent-state-

      - run: uv sync

      - name: Generate (generic_news)
        run: uv run social-media-manager-agent generate --mode generic_news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CINEMA_NAME: ${{ vars.CINEMA_NAME }}
          POST_LANGUAGE: ${{ vars.POST_LANGUAGE }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          MODEL_WRITE_POST: ${{ vars.MODEL_WRITE_POST }}

      - name: Generate (movie_release)
        run: uv run social-media-manager-agent generate --mode movie_release
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CINEMA_NAME: ${{ vars.CINEMA_NAME }}
          POST_LANGUAGE: ${{ vars.POST_LANGUAGE }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          MODEL_WRITE_POST: ${{ vars.MODEL_WRITE_POST }}

      - name: Persist movie post counts
        if: always()
        run: |
          if ! git diff --quiet -- data/movies.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/movies.csv
            git commit -m "chore: update movie post counts"
            git push
          fi

      - name: Save generated state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/history.json
            data/seen_urls.json
            output/
          key: agent-state-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-generate-${{ github.run_id }}
          path: output/agent.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload generated posts (for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posts-generate-${{ github.run_id }}
          path: |
            output/posts/
            output/images/
          retention-days: 14
          if-no-files-found: ignore
