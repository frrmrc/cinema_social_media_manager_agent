name: publish-due

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: agent-state
  cancel-in-progress: false

jobs:
  publish-due:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Restore generated state (history + posts + images)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history.json
            data/seen_urls.json
            output/
          key: agent-state-${{ github.run_id }}
          restore-keys: |
            agent-state-

      - run: uv sync

      - name: Publish due posts
        run: uv run social-media-manager-agent publish-due
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CINEMA_NAME: ${{ vars.CINEMA_NAME }}
          POST_LANGUAGE: ${{ vars.POST_LANGUAGE }}

      - name: Save generated state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/history.json
            data/seen_urls.json
            output/
          key: agent-state-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-publish-${{ github.run_id }}
          path: output/agent.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload posts state (for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posts-publish-${{ github.run_id }}
          path: |
            output/posts/
            output/images/
          retention-days: 14
          if-no-files-found: ignore
